name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    env:
      # ASIO's bindings are generated with the runner's own LLVM
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - name: Rust (the version of rust-toolchain.toml)
        shell: pwsh
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend packages
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend build
        working-directory: frontend
        run: pnpm build
      - name: Frontend format
        working-directory: frontend
        run: pnpm exec prettier --check src
      - name: Frontend tests
        working-directory: frontend
        run: pnpm exec ng test --watch=false
      - name: Rust format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Plugins the tests load
        run: cargo build -p sonevo-test-synth -p sonevo-test-effect -p sonevo-plugin-host
      - name: Rust tests
        run: cargo test --workspace
