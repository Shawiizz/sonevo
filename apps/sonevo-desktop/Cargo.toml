[package]
name = "sonevo-desktop"
description = "Sonevo desktop application (Tauri v2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "sonevo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sonevo-project.workspace = true
sonevo-dsp.workspace = true
sonevo-engine.workspace = true
sonevo-audio.workspace = true
sonevo-versions.workspace = true
sonevo-plugins.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
midir = "0.11"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls"] }
tauri-plugin-process = "2.4"

[dev-dependencies]
tempfile.workspace = true
