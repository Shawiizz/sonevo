[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "plugins/*", "spikes/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
sonevo-clap = { path = "crates/sonevo-clap" }
sonevo-plugin-ipc = { path = "crates/sonevo-plugin-ipc" }
sonevo-project = { path = "crates/sonevo-project" }
sonevo-dsp = { path = "crates/sonevo-dsp" }
sonevo-engine = { path = "crates/sonevo-engine" }
sonevo-audio = { path = "crates/sonevo-audio" }
sonevo-versions = { path = "crates/sonevo-versions" }
sonevo-plugins = { path = "crates/sonevo-plugins" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.4"
blake3 = "1"
rtrb = "0.3"
tempfile = "3"
gix = { version = "0.89", default-features = false, features = ["sha1"] }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis", "adpcm"] }
clap-sys = "0.5"
libloading = "0.9"
cpal = "0.18"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
debug = 1
